name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_images:
        description: Rebuild dependency images without cache (not a security approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONTAINER_ENGINE: docker
      CI_IMAGE_FLAGS: ${{ inputs.refresh_images && '--refresh' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, Node 24
        with:
          persist-credentials: false
      - name: Start fresh and check runner
        run: |
          make ci-start
          docker --version
          docker info --format '{{.ServerVersion}}'
          df -h .
      - name: Validate workflow in a contained tool
        run: >-
          docker run --rm --network=none --read-only --cap-drop=all
          --security-opt=no-new-privileges --memory=256m --cpus=1 --pids-limit=64
          -v "$PWD/.github:/repo/.github:ro" -w /repo
          docker.io/rhysd/actionlint:1.7.11@sha256:5457037ba91acd225478edac3d4b32e45cf6c10291e0dabbfd2491c63129afe1
          -shellcheck= -pyflakes= .github/workflows/ci.yml
      - name: Restore GNOME 49 dependency image
        if: ${{ !inputs.refresh_images }}
        id: cache49
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0, Node 24
        with:
          path: build/ci-cache/49
          key: ${{ runner.os }}-${{ runner.arch }}-shell49-${{ hashFiles('Dockerfile.shell', 'Dockerfile.aac', '.dockerignore', '.github/ci-image-generation', 'Makefile', 'scripts/container-shell.py') }}
      - name: Prepare GNOME 49
        run: make ci-image CI_PROFILE=49
      - name: Save trusted GNOME 49 dependency cache
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.refresh_images && steps.cache49.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ci-cache/49
          key: ${{ steps.cache49.outputs.cache-primary-key }}
      - name: Test GNOME 49 service and Shell at both scales
        run: make ci-test CI_PROFILE=49
      - name: Release owned GNOME 49 cache disk
        run: |
          docker image rm localhost/radiolina-ci:49
          rm -rf build/ci-cache/49
      - name: Restore GNOME 50 dependency image
        if: ${{ !inputs.refresh_images }}
        id: cache50
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ci-cache/50
          key: ${{ runner.os }}-${{ runner.arch }}-shell50-${{ hashFiles('Dockerfile.shell', 'Dockerfile.aac', '.dockerignore', '.github/ci-image-generation', 'Makefile', 'scripts/container-shell.py') }}
      - name: Prepare GNOME 50
        run: make ci-image CI_PROFILE=50
      - name: Save trusted GNOME 50 dependency cache
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.refresh_images && steps.cache50.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ci-cache/50
          key: ${{ steps.cache50.outputs.cache-primary-key }}
      - name: Test GNOME 50 service and Shell at both scales
        run: make ci-test CI_PROFILE=50
      - name: Release owned GNOME 50 cache archive
        run: rm -rf build/ci-cache/50
      - name: Restore AAC dependency image
        if: ${{ !inputs.refresh_images }}
        id: cacheaac
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ci-cache/aac
          key: ${{ runner.os }}-${{ runner.arch }}-aac50-${{ hashFiles('Dockerfile.shell', 'Dockerfile.aac', '.dockerignore', '.github/ci-image-generation', 'Makefile', 'scripts/container-shell.py') }}
      - name: Prepare AAC and test real ADTS/M4A decoding
        run: |
          make ci-image CI_PROFILE=aac
          make ci-test CI_PROFILE=aac
      - name: Save trusted AAC dependency cache
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.refresh_images && steps.cacheaac.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/ci-cache/aac
          key: ${{ steps.cacheaac.outputs.cache-primary-key }}
      - name: Build and verify installation ZIP after all tests
        run: make ci-package
      - name: Stage selected test evidence
        if: ${{ always() }}
        run: make ci-evidence
      - name: Upload verified development package
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: radiolina-install-${{ github.sha }}
          path: build/ci/artifacts/package/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload selected test evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radiolina-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/artifacts/test-evidence/
          if-no-files-found: warn
          retention-days: 3
      - name: Remove only owned CI images
        if: ${{ always() }}
        run: |
          for image in localhost/radiolina-ci:49 localhost/radiolina-ci:50 localhost/radiolina-ci-aac:44; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm "$image"
            fi
          done
